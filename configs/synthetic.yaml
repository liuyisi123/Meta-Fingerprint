model:
  seq_len: 250
  fs: 125.0
  local_dim: 16
  encoder_dim: 32
  ode_hidden_dim: 32
  ode_steps: 1
  ssm_hidden_dim: 32
  tau_min: 0.10
  tau_max: 0.40
  z_id_dim: 16
  z_bp_dim: 16
  decoder_channels: 32
  decoder_base_len: 32
  num_classes: 3
  dropout: 0.05
  use_spectral_norm: false
training:
  seed: 42
  epochs: 2
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  min_lr: 0.000001
  grad_clip_norm: 1.0
  num_workers: 0
  device: auto
  lambda_wave: 1.0
  lambda_pheno: 0.2
  lambda_dis: 0.05
  dis_warmup_steps: 50
  huber_delta: 5.0
  alpha_mi: 1.0
  beta_tc: 4.0
  gamma_mkl: 1.0
  lambda_consistency: 0.5
  consistency_margin: 0.9
  meta: false
  meta_frequency: 20
  tasks_per_batch: 2
  support_size: 2
  query_size: 2
  inner_steps: 1
  inner_lr: 0.01
  lambda_reg: 0.1
  monitor: val_rmse
  patience: 3
data:
  target_fs: 125.0
  window_sec: 2.0
  normalize_inputs: true
  normalize_abp: false

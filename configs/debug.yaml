model:
  seq_len: 64
  fs: 6.4
  input_channels: 2
  local_dim: 8
  encoder_dim: 8
  ode_hidden_dim: 8
  ode_steps: 1
  ssm_hidden_dim: 8
  tau_min: 0.040
  tau_max: 0.300
  z_id_dim: 4
  z_bp_dim: 4
  decoder_channels: 8
  decoder_base_len: 8
  num_classes: 3
  dropout: 0.05
  use_spectral_norm: false

training:
  seed: 42
  epochs: 2
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  min_lr: 1.0e-6
  grad_clip_norm: 1.0
  num_workers: 0
  device: cpu
  amp: false
  patience: 2
  lambda_wave: 1.0
  lambda_pheno: 0.2
  lambda_dis: 0.1
  dis_warmup_steps: 20
  huber_delta: 5.0
  alpha_mi: 1.0
  beta_tc: 1.0
  gamma_mkl: 1.0
  lambda_consistency: 0.1
  consistency_margin: 0.8
  meta: false
  meta_frequency: 20
  tasks_per_batch: 2
  support_size: 2
  query_size: 2
  inner_steps: 1
  inner_lr: 0.01
  lambda_reg: 0.01
  first_order: true
  monitor: val_rmse
  save_every: 0

data:
  target_fs: 6.4
  window_sec: 10.0
  normalize_inputs: true
  normalize_abp: false
  train_fraction: 0.60
  val_fraction: 0.20
  test_fraction: 0.20
